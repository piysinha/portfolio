name: Deploy

# Gate run on a preview deploy, promote the identical build to production, then Smoke run production.
# See docs/adr/0002-gated-deploys-and-separate-reports-site.md.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_PROJECT: piyush-sinha-portfolio
  REPORTS_PROJECT: piyush-sinha-test-reports
  PRODUCTION_URL: https://piyush-sinha-portfolio.pages.dev
  WRANGLER_VERSION: 4.140.0

jobs:
  gate:
    name: Gate run
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7
      - name: Create Pages projects if missing
        run: |
          existing=$(npx wrangler pages project list --json)
          for project in "$SITE_PROJECT" "$REPORTS_PROJECT"; do
            if grep -q "\"$project\"" <<< "$existing"; then
              echo "$project exists"
            else
              npx wrangler pages project create "$project" --production-branch main
            fi
          done
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.SITE_PROJECT }} --branch=preview --commit-dirty=true
      - name: Check preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then echo "No preview deployment URL from wrangler" >&2; exit 1; fi
          scripts/wait-for-url.sh "$PREVIEW_URL"
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test preview
        env:
          BASE_URL: ${{ steps.preview.outputs.deployment-url }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-report
          path: playwright-report/
          retention-days: 14
      - name: Screenshot-test preview (Docker)
        env:
          BASE_URL: ${{ steps.preview.outputs.deployment-url }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: visual-report
        run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-visual-report
          path: visual-report/
          retention-days: 14

  promote:
    name: Promote to production
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/
      - name: Skip production outside main
        if: github.ref != 'refs/heads/main'
        run: echo "Gate passed on ${{ github.ref_name }}; production deploy only runs on main."
      - name: Deploy the tested build to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.SITE_PROJECT }} --branch=main --commit-dirty=true

  smoke:
    name: Smoke run
    needs: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/wait-for-url.sh "$PRODUCTION_URL"
      - run: npx playwright install --with-deps chromium
      - name: Test production
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npx playwright test --grep @smoke --project chromium --project mobile-chrome
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
